[project]
name = "commit-msg-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.16.1",
    "mypy>=2.3.1",
    "openai>=3.1.0",
    "openrouter>=1.1.64",
    "pytest>=9.1.1",
]

[project.scripts]
commit-msg-generator = "commit_msg_generator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_msg_generator"]
